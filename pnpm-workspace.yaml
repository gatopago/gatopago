allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  '@firebase/util': false
  esbuild: false
  protobufjs: false

# Vetted: @grpc/grpc-js comes with Firestore inside the `firebase` package; the web imports only
# firebase/app and firebase/messaging, and both advisories concern a gRPC server.
auditConfig:
  ignoreGhsas:
    - GHSA-m9gg-hp2v-232j
    - GHSA-f596-whhp-79r4

minimumReleaseAge: 10080
# Mera 0.4.0 (19-11) before its 7 days: built from category-labs/mera at v0.4.0 with npm provenance,
# and its build makes no network calls. Remove once it is a week old (26-11).
minimumReleaseAgeExclude:
  - '@category-labs/mera@0.4.0'

# Transitive fixes from the 20-11 audit: zod through viem (abitype), follow-redirects through
# stellar-sdk (axios), re2js through firebase (Firestore, unused here).
overrides:
  'zod@>=4.0.0 <4.6.6': '^4.6.7'
  'follow-redirects@>=1.16.0 <1.16.2': '^1.16.3'
  're2js@<2.8.7': '^2.8.8'
